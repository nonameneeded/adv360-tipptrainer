<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Adv360 Tipptrainer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="leiste">
    <h1>Adv360 Tipptrainer</h1>
    <div class="gruppe" id="layoutwahl" role="radiogroup" aria-label="Layout">
      <button data-layout="qwertz">QWERTZ</button>
      <button data-layout="bone">Bone</button>
    </div>
    <div class="gruppe" id="moduswahl" role="radiogroup" aria-label="Übung">
      <button data-modus="lernen">Lernen</button>
      <button data-modus="schwaechen">Schwächen</button>
      <button data-modus="saetze">Sätze</button>
      <button data-modus="symbole">Symbole</button>
      <button data-modus="test">Test 1 min</button>
    </div>
    <button id="auswertung-knopf" class="dezent" aria-expanded="false">Auswertung</button>
    <button id="einstellungen-knopf" class="dezent" aria-expanded="false">Einstellungen</button>
    <a id="github" href="https://github.com/nonameneeded/adv360-tipptrainer" title="Quellcode auf GitHub" aria-label="Quellcode auf GitHub">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </header>

  <section id="einstellungen" hidden>
    <label><input type="checkbox" id="opt-gross"> Groß-/Kleinschreibung</label>
    <label><input type="checkbox" id="opt-satzzeichen"> Satzzeichen einstreuen</label>
    <label><input type="checkbox" id="opt-tastatur"> Tastatur anzeigen</label>
    <label>Ziel <input type="number" id="opt-ziel" min="60" max="600" step="10"> Anschläge/min</label>
    <button id="zuruecksetzen" class="dezent">Fortschritt dieses Layouts löschen</button>
    <div class="zeile">
      <span>Nächster Buchstabe ab</span>
      <label><input type="number" id="opt-genau" min="80" max="100" step="1"> % Genauigkeit</label>
      <label>und <input type="number" id="opt-huerde" min="0" max="100" step="5"> % des Ziel-Tempos,</label>
      <label>spätestens nach <input type="number" id="opt-notausgang" min="0" max="120" step="5"> min Übung (0 = nie)</label>
      <button id="freischalten" class="dezent">Jetzt freischalten</button>
    </div>
  </section>

  <section id="auswertung" hidden>
    <h2>Verlauf</h2>
    <div id="verlauf"></div>
    <h2>Verwechslungen</h2>
    <div id="auswertung-inhalt"></div>
    <button id="schwaechen-ueben">Schwächen gezielt üben</button>
  </section>

  <main>
    <section class="werte">
      <div><span id="wert-tempo">–</span><small>Anschläge/min</small></div>
      <div><span id="wert-genau">–</span><small>Genauigkeit</small></div>
      <div><span id="wert-heute">0:00</span><small>heute geübt</small></div>
      <div id="wert-timer-box" hidden><span id="wert-timer">60</span><small>Sekunden</small></div>
    </section>

    <section id="buchstaben" aria-label="Freigeschaltete Buchstaben"></section>
    <p id="naechster" class="dezent"></p>

    <section id="text" tabindex="0" aria-live="polite"></section>
    <p id="hinweis"></p>
    <p id="meldung" role="status"></p>

    <div class="gruppe" id="ansichtwahl" role="radiogroup" aria-label="Tastatur-Ansicht">
      <button data-ansicht="finger">Finger</button>
      <button data-ansicht="heatmap">Heatmap</button>
    </div>
    <section id="tastatur" aria-hidden="true"></section>
    <p id="heat-legende" class="dezent" hidden>
      Heatmap: <span class="farbe rot"></span> langsam oder viele Fehler · <span class="farbe gruen"></span> Ziel-Tempo
      sicher erreicht · ohne Farbe = noch nicht geübt. Maus auf eine Taste zeigt die Werte je Zeichen.
    </p>
    <p id="layout-hinweis" class="dezent"></p>
  </main>

  <script src="js/layouts.js"></script>
  <script src="js/woerter.js"></script>
  <script src="js/uebungen.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
